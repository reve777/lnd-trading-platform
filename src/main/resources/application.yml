server:
  port: 8085

spring:
  application:
    name: lightning-trading-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/lightning_trade_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms

# Lightning Network Daemon (LND) Configuration
lnd:
  mode: mock          # Options: "mock" (built-in lightning simulator) or "real" (physical LND node)
  host: localhost
  port: 8080
  use-ssl: false
  macaroon-hex: ""
  tls-cert-path: ""

logging:
  level:
    com.lightning.trading: INFO
    org.springframework.security: WARN
