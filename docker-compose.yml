version: '3.8'

services:
  lightning-postgres:
    image: postgres:16-alpine
    container_name: lightning_postgres
    restart: always
    environment:
      POSTGRES_DB: lightning_trade_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - lightning_pgdata:/var/lib/postgresql/data

  lightning-redis:
    image: redis:7-alpine
    container_name: lightning_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - lightning_redisdata:/data

volumes:
  lightning_pgdata:
  lightning_redisdata:
